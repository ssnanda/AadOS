apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {app.kubernetes.io/name: aados-api, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: aados-api, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aados-api, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: {{ required "api.image is required" .Values.api.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 4000}]
          env:
            - name: PORT
              value: "4000"
            - name: AADOS_ENABLE_DATABASE
              value: "false"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: aados-api-secrets
                  key: secret_key_base
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: aados-api, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{port: 4000, targetPort: http, protocol: TCP, name: http}]
