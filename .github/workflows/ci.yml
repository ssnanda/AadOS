name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aados_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AADOS_TEST_DATABASE_URL: ecto://postgres:postgres@localhost:5432/aados_test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17.3'
          otp-version: '27.2'
      - name: Fetch dependencies
        working-directory: apps/api
        run: mix deps.get
      - name: Compile
        working-directory: apps/api
        run: mix compile --warnings-as-errors
      - name: Unit tests
        working-directory: apps/api
        run: mix test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Type and Svelte checks
        working-directory: apps/web
        run: npm run check
      - name: Unit tests
        working-directory: apps/web
        run: npm test
      - name: Build web
        working-directory: apps/web
        run: npm run build
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax checks
        run: bash -n bin/*.sh
      - name: JSON metadata validation
        run: python3 -m json.tool apps/web/package.json >/dev/null
  release-tag:
    name: Tag successful versioned release
    needs: [api, web, scripts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version metadata and create version tag when absent
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          v = Path('VERSION').read_text().strip()
          assert json.loads(Path('apps/web/package.json').read_text())['version'] == v
          assert f'version: "{v}"' in Path('apps/api/mix.exs').read_text()
          assert f'version: "{v}"' in Path('apps/api/lib/aados/api/controllers/health_controller.ex').read_text()
          assert f'version: "{v}"' in Path('charts/aados/Chart.yaml').read_text()
          assert f'appVersion: "{v}"' in Path('charts/aados/Chart.yaml').read_text()
          PY
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid SemVer: $version" >&2
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; no tag overwrite."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "AadOS $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
