name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17.3'
          otp-version: '27.2'
      - name: Fetch dependencies
        working-directory: apps/api
        run: mix deps.get
      - name: Compile
        working-directory: apps/api
        run: mix compile --warnings-as-errors
      - name: Unit tests
        working-directory: apps/api
        run: mix test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Type and Svelte checks
        working-directory: apps/web
        run: npm run check
      - name: Build web
        working-directory: apps/web
        run: npm run build
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax checks
        run: bash -n bin/*.sh
      - name: JSON metadata validation
        run: python3 -m json.tool apps/web/package.json >/dev/null
