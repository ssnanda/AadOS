apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: aados-private-app
parameters:
  - name: APP_NAME
    value: aados
  - name: NAMESPACE
    required: true
  - name: HOSTNAME
    value: os.aadnanda.com
  - name: CERT_ISSUER
    value: letsencrypt-ncllc
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}-api
      labels:
        app.kubernetes.io/part-of: aados
        app.kubernetes.io/component: api
    spec:
      replicas: 1
      revisionHistoryLimit: 3
      selector:
        matchLabels:
          app.kubernetes.io/name: ${APP_NAME}-api
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: aados
            app.kubernetes.io/name: ${APP_NAME}-api
            app.kubernetes.io/component: api
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: api
              image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/${APP_NAME}-api:latest
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 4000
              env:
                - name: PORT
                  value: '4000'
                - name: AADOS_ENABLE_DATABASE
                  value: 'false'
                - name: SECRET_KEY_BASE
                  valueFrom:
                    secretKeyRef:
                      name: aados-api-secrets
                      key: secret_key_base
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              livenessProbe:
                httpGet:
                  path: /api/health
                  port: http
                initialDelaySeconds: 15
                periodSeconds: 20
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 10
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}-api
      labels:
        app.kubernetes.io/part-of: aados
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: ${APP_NAME}-api
      ports:
        - name: http
          port: 4000
          targetPort: http
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}-web
      labels:
        app.kubernetes.io/part-of: aados
        app.kubernetes.io/component: web
    spec:
      replicas: 1
      revisionHistoryLimit: 3
      selector:
        matchLabels:
          app.kubernetes.io/name: ${APP_NAME}-web
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: aados
            app.kubernetes.io/name: ${APP_NAME}-web
            app.kubernetes.io/component: web
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: web
              image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/${APP_NAME}-web:latest
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
              env:
                - name: NODE_ENV
                  value: production
                - name: HOST
                  value: '0.0.0.0'
                - name: PORT
                  value: '3000'
                - name: AADOS_API_URL
                  value: http://${APP_NAME}-api:4000
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              livenessProbe:
                httpGet:
                  path: /
                  port: http
                initialDelaySeconds: 20
                periodSeconds: 20
              readinessProbe:
                httpGet:
                  path: /
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 10
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}-web
      labels:
        app.kubernetes.io/part-of: aados
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: ${APP_NAME}-web
      ports:
        - name: http
          port: 3000
          targetPort: http
  # OpenShift's default Ingress controller generates the Route. cert-manager
  # provisions and renews the custom-host certificate in ${APP_NAME}-tls.
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: ${APP_NAME}-web
      labels:
        app.kubernetes.io/part-of: aados
        app.kubernetes.io/component: web
      annotations:
        cert-manager.io/cluster-issuer: ${CERT_ISSUER}
        route.openshift.io/termination: edge
    spec:
      ingressClassName: openshift-default
      tls:
        - hosts:
            - ${HOSTNAME}
          secretName: ${APP_NAME}-tls
      rules:
        - host: ${HOSTNAME}
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${APP_NAME}-web
                    port:
                      name: http
