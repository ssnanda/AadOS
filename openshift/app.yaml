apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: aados-private-app
parameters:
  - name: APP_NAME
    value: aados
  - name: NAMESPACE
    required: true
  - name: HOSTNAME
    value: os.aadnanda.com
  - name: CERT_ISSUER
    value: letsencrypt-prod
objects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${APP_NAME}-web-data
      labels:
        app.kubernetes.io/part-of: aados
        app.kubernetes.io/component: web
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi
  # PostgreSQL 16 for AadOS (state, AI insights, drafts, briefings, documents, finance). OpenShift-native image:
  # runs as the namespace's random UID under the restricted SCC. Password: aados-api-secrets/postgres-password.
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${APP_NAME}-db-data
      labels:
        app.kubernetes.io/part-of: aados
        app.kubernetes.io/component: db
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 5Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}-db
      labels:
        app.kubernetes.io/part-of: aados
        app.kubernetes.io/component: db
    spec:
      replicas: 1
      revisionHistoryLimit: 3
      # One writer on an RWO volume: stop the old pod before starting the new one.
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app.kubernetes.io/name: ${APP_NAME}-db
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: aados
            app.kubernetes.io/name: ${APP_NAME}-db
            app.kubernetes.io/component: db
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: postgres
              image: quay.io/sclorg/postgresql-16-c9s:latest
              imagePullPolicy: IfNotPresent
              ports:
                - name: postgres
                  containerPort: 5432
              env:
                - name: POSTGRESQL_USER
                  value: aados
                - name: POSTGRESQL_DATABASE
                  value: aados
                - name: POSTGRESQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: aados-api-secrets
                      key: postgres-password
              volumeMounts:
                - name: db-data
                  mountPath: /var/lib/pgsql/data
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              readinessProbe:
                exec:
                  command: [/usr/libexec/check-container]
                initialDelaySeconds: 5
                periodSeconds: 10
              livenessProbe:
                exec:
                  command: [/usr/libexec/check-container, --live]
                initialDelaySeconds: 120
                periodSeconds: 20
          volumes:
            - name: db-data
              persistentVolumeClaim:
                claimName: ${APP_NAME}-db-data
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}-db
      labels:
        app.kubernetes.io/part-of: aados
        app.kubernetes.io/component: db
    spec:
      selector:
        app.kubernetes.io/name: ${APP_NAME}-db
      ports:
        - name: postgres
          port: 5432
          targetPort: postgres
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}-api
      labels:
        app.kubernetes.io/part-of: aados
        app.kubernetes.io/component: api
    spec:
      replicas: 1
      revisionHistoryLimit: 3
      selector:
        matchLabels:
          app.kubernetes.io/name: ${APP_NAME}-api
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: aados
            app.kubernetes.io/name: ${APP_NAME}-api
            app.kubernetes.io/component: api
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: api
              image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/${APP_NAME}-api:latest
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 4000
              env:
                - name: PORT
                  value: '4000'
                - name: AADOS_ENABLE_DATABASE
                  value: 'true'
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: aados-api-secrets
                      key: postgres-password
                - name: DATABASE_URL
                  value: ecto://aados:$(POSTGRES_PASSWORD)@${APP_NAME}-db:5432/aados
                - name: SECRET_KEY_BASE
                  valueFrom:
                    secretKeyRef:
                      name: aados-api-secrets
                      key: secret_key_base
                - name: AADOS_CREDENTIAL_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aados-api-secrets
                      key: credential-encryption-key
                      optional: true
                - name: AADOS_INTERNAL_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: aados-api-secrets
                      key: internal-api-token
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              livenessProbe:
                httpGet:
                  path: /api/health
                  port: http
                initialDelaySeconds: 15
                periodSeconds: 20
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 10
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}-api
      labels:
        app.kubernetes.io/part-of: aados
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: ${APP_NAME}-api
      ports:
        - name: http
          port: 4000
          targetPort: http
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}-web
      labels:
        app.kubernetes.io/part-of: aados
        app.kubernetes.io/component: web
    spec:
      replicas: 1
      revisionHistoryLimit: 3
      selector:
        matchLabels:
          app.kubernetes.io/name: ${APP_NAME}-web
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: aados
            app.kubernetes.io/name: ${APP_NAME}-web
            app.kubernetes.io/component: web
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: web
              image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/${APP_NAME}-web:latest
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
              env:
                - name: NODE_ENV
                  value: production
                - name: HOST
                  value: '0.0.0.0'
                - name: PORT
                  value: '3000'
                - name: ORIGIN
                  value: https://${HOSTNAME}
                - name: AADOS_API_URL
                  value: http://${APP_NAME}-api:4000
                - name: AADOS_USER
                  valueFrom:
                    secretKeyRef:
                      name: aados-api-secrets
                      key: aados-user
                - name: AADOS_PASSWORD_HASH
                  valueFrom:
                    secretKeyRef:
                      name: aados-api-secrets
                      key: aados-password-hash
                - name: AADOS_SESSION_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: aados-api-secrets
                      key: secret_key_base
                - name: AADOS_DATA_DIR
                  value: /data/aados
                - name: AADOS_DB_READ
                  value: 'off'
                # PostgreSQL is primary: the first start copies state.enc into it (backup kept, file untouched).
                # Rollback: AADOS_STORAGE=file (changes made after the switch stay only in PostgreSQL).
                - name: AADOS_STORAGE
                  value: postgres
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: aados-api-secrets
                      key: postgres-password
                - name: AADOS_DATABASE_URL
                  value: postgres://aados:$(POSTGRES_PASSWORD)@${APP_NAME}-db:5432/aados
                - name: AADOS_CREDENTIAL_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aados-api-secrets
                      key: credential-encryption-key
                # Document uploads up to 25 MB (adapter-node default is 512 KB).
                - name: BODY_SIZE_LIMIT
                  value: '27M'
                - name: AADOS_INTERNAL_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: aados-api-secrets
                      key: internal-api-token
                      optional: true
              volumeMounts:
                - name: web-data
                  mountPath: /data/aados
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              livenessProbe:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 20
                periodSeconds: 20
              readinessProbe:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 10
          volumes:
            - name: web-data
              persistentVolumeClaim:
                claimName: ${APP_NAME}-web-data
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}-web
      labels:
        app.kubernetes.io/part-of: aados
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: ${APP_NAME}-web
      ports:
        - name: http
          port: 3000
          targetPort: http
  # OpenShift's default Ingress controller generates the Route. cert-manager
  # provisions and renews the custom-host certificate in ${APP_NAME}-tls.
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: ${APP_NAME}-web
      labels:
        app.kubernetes.io/part-of: aados
        app.kubernetes.io/component: web
      annotations:
        cert-manager.io/cluster-issuer: ${CERT_ISSUER}
        route.openshift.io/termination: edge
    spec:
      ingressClassName: openshift-default
      tls:
        - hosts:
            - ${HOSTNAME}
          secretName: ${APP_NAME}-tls
      rules:
        - host: ${HOSTNAME}
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${APP_NAME}-web
                    port:
                      name: http
